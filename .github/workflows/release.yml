name: Release

# Pushing a version tag builds the app and publishes a GitHub release with the
# disk image. The tag must match the version in mygo.json, so a mistyped tag
# publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, such as v0.3.6
        required: true

permissions:
  contents: write

jobs:
  release:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag matches mygo.json
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="$(jq -r .version mygo.json)"
          echo "tag=$TAG version=$version"
          test "$TAG" = "v$version"

      - name: Build and upload signed update files
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || {
            echo "MYGO_UPDATER_PRIVATE_KEY is required" >&2
            exit 1
          }
          if is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$is_draft" = "true" || {
              echo "Refusing to overwrite published release $TAG" >&2
              exit 1
            }
          fi
          go tool mygo build -platform darwin/universal -upload
          version="$(jq -r .version mygo.json)"
          test -s "build/darwin-universal/Mote $version.dmg"
          test -s "build/darwin-universal/mote-$version-darwin-universal.tar.gz"
          test -s build/darwin-universal/update-darwin-universal.json

      - name: Keep the build for troubleshooting
        uses: actions/upload-artifact@v7
        with:
          name: Mote-macos-universal
          path: build/*/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="$(jq -r .version mygo.json)"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Mote $version for macOS 12 or later, on Apple silicon and Intel.

          ## Install

          1. Open the disk image and drag **Mote** into Applications.
          2. The app is not notarized, so the first launch needs
             right-click > Open, or
             \`xattr -dr com.apple.quarantine /Applications/Mote.app\`.

          Mote lives in the menu bar: click the note icon, or press
          ⇧⌘M from anywhere.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest \
            --title "Mote $version" --notes-file "$RUNNER_TEMP/notes.md"
